<!DOCTYPE html>
<html>
<head>
    <title>Gann Wheel Visualization</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #00ff00;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            margin: 0 0 20px 0;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .controls {
            background: rgba(0, 20, 0, 0.5);
            padding: 15px;
            border: 1px solid #00aa00;
            border-radius: 5px;
        }
        
        .controls label {
            display: block;
            margin: 10px 0 5px 0;
            color: #00ff00;
            font-weight: bold;
        }
        
        .controls input {
            width: 100%;
            padding: 8px;
            background: #0a0a0a;
            border: 1px solid #00ff00;
            color: #00ff00;
            border-radius: 3px;
            box-sizing: border-box;
        }
        
        .controls button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #ffaa00;
            color: #000;
            border: none;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .controls button:hover {
            background: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        
        .wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 10, 0, 0.3);
            padding: 20px;
            border: 1px solid #00aa00;
            border-radius: 5px;
        }
        
        canvas {
            border: 1px solid #00ff00;
            border-radius: 5px;
            background: #000;
        }
        
        .stats {
            background: rgba(0, 20, 0, 0.5);
            padding: 15px;
            border: 1px solid #00aa00;
            border-radius: 5px;
            grid-column: 1 / -1;
        }
        
        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin: 10px 0;
        }
        
        .stat-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-left: 3px solid #ffaa00;
            border-radius: 3px;
        }
        
        .stat-label {
            font-size: 0.8em;
            color: #00aa00;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 1.3em;
            color: #ffaa00;
            font-weight: bold;
        }
        
        .legend {
            background: rgba(0, 20, 0, 0.5);
            padding: 10px;
            border: 1px solid #00aa00;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        .legend-item {
            display: inline-block;
            margin-right: 20px;
        }
        
        .legend-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            vertical-align: middle;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ GANN WHEEL ANALYSIS</h1>
        
        <div class="grid">
            <div class="controls">
                <label>Current Price:</label>
                <input type="number" id="priceInput" value="2050.5" step="0.1">
                
                <label>High Price:</label>
                <input type="number" id="highInput" value="2060.0" step="0.1">
                
                <label>Low Price:</label>
                <input type="number" id="lowInput" value="2040.0" step="0.1">
                
                <label>Wheel Type:</label>
                <select id="wheelType" style="width: 100%; padding: 8px; background: #0a0a0a; border: 1px solid #00ff00; color: #00ff00; border-radius: 3px; margin-top: 5px;">
                    <option value="360">360° - Major Harmony</option>
                    <option value="180">180° - Opposition</option>
                    <option value="90">90° - Square</option>
                    <option value="45">45° - Octave</option>
                </select>
                
                <button onclick="updateWheel()">🔄 UPDATE WHEEL</button>
            </div>
            
            <div class="wheel-container">
                <canvas id="gannWheel" width="400" height="400"></canvas>
            </div>
        </div>
        
        <div class="stats">
            <h3 style="margin-top: 0; color: #ffaa00;">📊 GANN METRICS</h3>
            <div class="stat-row">
                <div class="stat-item">
                    <div class="stat-label">Current Degree</div>
                    <div class="stat-value" id="degreeValue">0°</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Price Distance</div>
                    <div class="stat-value" id="distanceValue">0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Harmonic Angle</div>
                    <div class="stat-value" id="harmonicValue">0°</div>
                </div>
            </div>
            
            <div class="stat-row">
                <div class="stat-item">
                    <div class="stat-label">Square-of-9 Level</div>
                    <div class="stat-value" id="sq9Value">0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Spiral Radius</div>
                    <div class="stat-value" id="spiralValue">0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Market Bias</div>
                    <div class="stat-value" id="biasValue">NEUTRAL</div>
                </div>
            </div>
            
            <div class="legend">
                <span class="legend-item">
                    <span class="legend-color" style="background: #00ff00;"></span>
                    Current Price
                </span>
                <span class="legend-item">
                    <span class="legend-color" style="background: #ffaa00;"></span>
                    Key Harmonic Levels
                </span>
                <span class="legend-item">
                    <span class="legend-color" style="background: #ff5555;"></span>
                    High / Resistance
                </span>
                <span class="legend-item">
                    <span class="legend-color" style="background: #55ff55;"></span>
                    Low / Support
                </span>
            </div>
        </div>
    </div>
    
    <script>
        function drawGannWheel() {
            const canvas = document.getElementById('gannWheel');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 150;
            
            const price = parseFloat(document.getElementById('priceInput').value);
            const wheelType = parseInt(document.getElementById('wheelType').value);
            
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw outer circle
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Calculate current price degree
            const degree = (price * 360 / 360) % 360;
            
            // Draw degree markers
            ctx.strokeStyle = '#00aa00';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#00aa00';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            
            for (let i = 0; i < 360; i += 45) {
                const angle = (i - 90) * Math.PI / 180;
                const x1 = centerX + radius * Math.cos(angle);
                const y1 = centerY + radius * Math.sin(angle);
                const x2 = centerX + (radius - 15) * Math.cos(angle);
                const y2 = centerY + (radius - 15) * Math.sin(angle);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                
                // Draw degree labels
                const labelX = centerX + (radius + 20) * Math.cos(angle);
                const labelY = centerY + (radius + 20) * Math.sin(angle);
                ctx.fillText(i + '°', labelX, labelY + 3);
            }
            
            // Draw minor tick marks every 15 degrees
            ctx.strokeStyle = '#004400';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 360; i += 15) {
                if (i % 45 !== 0) {
                    const angle = (i - 90) * Math.PI / 180;
                    const x1 = centerX + radius * Math.cos(angle);
                    const y1 = centerY + radius * Math.sin(angle);
                    const x2 = centerX + (radius - 8) * Math.cos(angle);
                    const y2 = centerY + (radius - 8) * Math.sin(angle);
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }
            
            // Draw harmonic angles (45-degree intervals)
            ctx.strokeStyle = '#ffaa0040';
            ctx.lineWidth = 1;
            for (let i = 0; i < 360; i += 45) {
                const angle = (i - 90) * Math.PI / 180;
                const x1 = centerX + radius * Math.cos(angle);
                const y1 = centerY + radius * Math.sin(angle);
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x1, y1);
                ctx.stroke();
            }
            
            // Draw current price position
            const priceAngle = (degree - 90) * Math.PI / 180;
            const priceX = centerX + radius * Math.cos(priceAngle);
            const priceY = centerY + radius * Math.sin(priceAngle);
            
            // Draw price indicator
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(priceX, priceY, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(priceX, priceY, 12, 0, Math.PI * 2);
            ctx.stroke();
            
            // Draw line from center to current price
            ctx.strokeStyle = '#00ff0080';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(priceX, priceY);
            ctx.stroke();
            
            // Draw price label
            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(price.toFixed(2), priceX + 20, priceY - 15);
            ctx.fillText(degree.toFixed(1) + '°', priceX + 20, priceY + 5);
            
            // Update stats
            document.getElementById('degreeValue').textContent = degree.toFixed(1) + '°';
            document.getElementById('harmonicValue').textContent = (degree % 45).toFixed(1) + '°';
            
            // Draw center circle
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function updateWheel() {
            const price = parseFloat(document.getElementById('priceInput').value);
            const high = parseFloat(document.getElementById('highInput').value);
            const low = parseFloat(document.getElementById('lowInput').value);
            
            const distance = price - low;
            const range = high - low;
            
            // Calculate Square-of-9 level
            const sq9 = Math.sqrt(price) * 100;
            
            // Calculate spiral radius
            const spiralRadius = Math.sqrt(price);
            
            // Determine bias
            const midpoint = (high + low) / 2;
            const bias = price > midpoint ? 'BULLISH' : price < midpoint ? 'BEARISH' : 'NEUTRAL';
            
            // Update stats
            document.getElementById('distanceValue').textContent = distance.toFixed(2);
            document.getElementById('sq9Value').textContent = sq9.toFixed(2);
            document.getElementById('spiralValue').textContent = spiralRadius.toFixed(2);
            document.getElementById('biasValue').textContent = bias;
            
            drawGannWheel();
        }
        
        // Initialize on load
        window.addEventListener('load', updateWheel);
        
        // Update on input change
        document.getElementById('priceInput').addEventListener('change', updateWheel);
        document.getElementById('highInput').addEventListener('change', updateWheel);
        document.getElementById('lowInput').addEventListener('change', updateWheel);
        document.getElementById('wheelType').addEventListener('change', updateWheel);
    </script>
</body>
</html>
